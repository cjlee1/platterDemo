<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Best Sellers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600&family=Source+Serif+Pro:wght@900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <main>
      <!-- Section Header -->
      <header>
        <h1 class="text-[40px] font-black leading-[1.2] tracking-[-0.01em] font-['Source_Serif_Pro']">Best Sellers</h1>
        <a href="#" class="text-[14px] font-semibold leading-[1.4] tracking-[0.03em] text-center font-['Poppins']">
          Shop All Best Sellers
          <svg
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 5l7 7-7 7"
            />
          </svg>
        </a>
      </header>

      <!-- Product Grid -->
      <section>
        <div
          id="product-grid"
          class="grid grid-cols-2 gap-4 md:flex md:gap-6 md:overflow-x-auto md:pb-4 product-scroll"
        >
          <!-- Products injected via JS -->
        </div>
      </section>

      <!-- Show More Button (Mobile Only) -->
      <div>
        <button id="show-more-btn" type="button">Show More</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
