<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Best Sellers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;500;600&family=Source+Serif+Pro:wght@900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="bg-white">
    <main class="max-w-7xl mx-auto px-4 py-12">
      <!-- Section Header  -->
      <header class="flex flex-col items-center md:flex-row md:justify-between md:items-center mb-8">
        <h1 class="text-[40px] font-black leading-[1.2] tracking-[-0.01em] font-['Source_Serif_Pro'] text-center md:text-left">Best Sellers</h1>
        <a href="#" class="hidden md:flex items-center gap-2 text-[14px] font-semibold leading-[1.4] tracking-[0.03em] font-['Poppins'] hover:underline">
          Shop All Best Sellers
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 5l7 7-7 7"
            />
          </svg>
        </a>
      </header>

      <!-- Product Grid -->
      <section>
        <div
          id="product-grid"
          class="grid grid-cols-2 gap-4 md:flex md:gap-6 product-scroll"
        >
          <!-- Products injected via JS -->
        </div>
      </section>

      <!-- Show More Button (Mobile Only) -->
      <div class="md:hidden mt-6">
        <button
          id="show-more-btn"
          type="button"
          class="w-full py-3 px-6 bg-gray-900 text-white font-medium rounded-full hover:bg-gray-800 transition-colors font-['Poppins']"
        >
          Show More
        </button>
      </div>
    </main>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
